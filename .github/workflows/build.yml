
name: Build FPS Optimizer Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Build for Android 64-bit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          path: ./

      - name: Upload Geode mod
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Optimizer-Pro-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
